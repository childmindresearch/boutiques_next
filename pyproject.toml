[project]
name = "boutiques"
version = "0.1.0.dev0"
description = "Boutiques descriptor toolkit: validate, generate examples, simulate, and launch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Boutiques contributors" },
]
dependencies = [
  "pydantic>=2.11",
  "typer>=0.12",
  "rich>=13",
]

[project.scripts]
bosh = "boutiques.cli:app"

[project.urls]
Homepage = "https://github.com/boutiques/boutiques"

[build-system]
requires = ["uv_build>=0.5,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "boutiques"
module-root = "src"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
  "mypy>=1.13",
]
docs = [
  "mkdocs-material>=9",
  "mkdocs-typer2>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
