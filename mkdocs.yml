site_name: Boutiques
site_description: A Python toolkit for the Boutiques descriptor standard.
# Pre-merge home; will flip to boutiques/boutiques once upstreamed.
site_url: https://childmindresearch.github.io/boutiques_next/
repo_url: https://github.com/childmindresearch/boutiques_next
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Specification:
      - spec/index.md
      - Basic structure: spec/basic_structure.md
      - File handling: spec/file_handling.md
      - Subcommands: spec/subcommands.md
      - Advanced features: spec/advanced_features.md
      - Examples: spec/examples.md
      - Troubleshooting: spec/troubleshooting.md
  - CLI:
      - cli/index.md
      - validate: cli/validate.md
      - example: cli/example.md
      - exec: cli/exec.md
      - test: cli/test.md
      - pprint: cli/pprint.md
      - schema-export: cli/schema-export.md
      - version: cli/version.md
  - Python API:
      - api/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            docstring_style: google
            show_source: false
            members_order: source
            merge_init_into_class: true
            heading_level: 3
